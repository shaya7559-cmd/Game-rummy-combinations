<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקות רמי קומבינציות</title>
<style>
  body { font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif; margin: 16px; background: #fff; color: #1c1c1e; }
  .pass { color: #2f6b3f; }
  .fail { color: #b42318; font-weight: 700; }
  #sum { font-size: 1.2rem; font-weight: 700; }
  li small { display: block; direction: ltr; text-align: left; font-family: Consolas, monospace; }
</style>
</head>
<body>
<h1>בדיקות לוגיקה, דוחות וסנכרון</h1>
<p id="sum">רץ…</p>
<ol id="out"></ol>
<script src="logic.js"></script>
<script src="stats.js"></script>
<script src="tournaments.js"></script>
<script src="sync.js"></script>
<script>
(async function () {
  'use strict';
  const R = Rummy, ST = RummyStats, SY = RummySync;
  const tests = [];
  const test = (name, fn) => tests.push([name, fn]);
  function eq(actual, expected, msg) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error((msg ? msg + ': ' : '') + 'expected ' + e + ', got ' + a);
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }

  // Plays the open game of the evening.
  // adds[k] = points player k scored during the game (a number or a list; 0 = none).
  // hand[k] for every player but the closer: points left in hand, or 'X' = never went down.
  function play(g, closerIdx, hand, adds) {
    const i = R.currentIndex(g);
    const r = g.rounds[i];
    g.players.forEach((p, k) => {
      [].concat(adds && adds[k] != null ? adds[k] : []).forEach((n) => { if (n && !R.addPoints(r, p.id, n)) throw new Error('bad points ' + n); });
    });
    const res = { closerId: g.players[closerIdx].id, entries: {} };
    g.players.forEach((p, k) => {
      if (k === closerIdx) return;
      res.entries[p.id] = hand[k] === 'X' ? { notDown: true } : { points: hand[k], notDown: false };
    });
    const err = R.validateResult(g, res);
    if (err) throw new Error(err);
    R.setResult(g, i, res);
    return i;
  }
  const totalsByName = (g) => { const t = R.totals(g), o = {}; g.players.forEach((p) => { o[p.name] = t[p.id]; }); return o; };

  // ---------------- logic ----------------
  test('ערב חדש מתחיל במשחק פתוח אחד, בלי מספר משחקים קבוע', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    eq(g.rounds.length, 1);
    eq([R.currentIndex(g), R.playedCount(g)], [0, 0]);
    play(g, 0, [0, 5, 5]);
    eq([g.rounds.length, R.currentIndex(g), R.playedCount(g)], [2, 1, 1], 'ending a game opens the next one');
  });

  test('המחלק עובר לשחקן הבא בכל משחק, מתחילים מהמחלק שנבחר', () => {
    const g = R.newGame(['א', 'ב', 'ג', 'ד'], { firstDealer: 2 });
    eq([0, 1, 2, 3, 4].map((i) => R.dealer(g, i).name), ['ג', 'ד', 'א', 'ב', 'ג']);
    play(g, 1, [3, 0, 3, 3]);
    eq(R.dealer(g, R.currentIndex(g)).name, 'ד');
  });

  test('נקודות במהלך משחק: רק מספרים שלמים גדולים מאפס, ואפשר לתקן ולמחוק', () => {
    const r = R.newRound();
    eq([R.addPoints(r, 'p1', 15), R.addPoints(r, 'p1', '12')], [true, true]);
    eq([0, -5, 2.5, '', null, 'abc', R.MAX_POINTS + 1].map((n) => R.addPoints(r, 'p1', n)), [false, false, false, false, false, false, false]);
    eq(R.addsOf(r, 'p1'), [15, 12]);
    eq(R.addsSum(r, 'p1'), 27);
    eq(R.setPoints(r, 'p1', 0, 20), true);
    eq(R.setPoints(r, 'p1', 0, 0), false, 'a fix must stay above 0');
    eq(R.removePoints(r, 'p1', 1), true);
    eq(R.addsOf(r, 'p1'), [20]);
    R.removePoints(r, 'p1', 0);
    eq(r.adds, {}, 'an empty list is removed');
    eq(R.hasAdds(r), false);
  });

  test('סוף משחק: המנצח שומר את מה שצבר, השאר מפסידים את מה שנשאר ביד, ומי שלא ירד ‎-70', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    play(g, 0, [0, 12, 'X'], [[30, 20], 15, 0]);
    eq(R.roundScores(g, g.rounds[0]), { p1: 50, p2: 3, p3: -70 });
  });

  test('"לא ירד" מוצע למי שלא צבר נקודות במשחק', () => {
    const r = R.newRound();
    R.addPoints(r, 'p1', 10);
    eq([R.suggestNotDown(r, 'p1'), R.suggestNotDown(r, 'p2')], [false, true]);
  });

  test('סכום מצטבר בכל שורה, ועריכה של משחק ישן מעדכנת את הכול', () => {
    const g = R.newGame(['א', 'ב']);
    play(g, 0, [0, 20], [40, 10]);
    play(g, 1, [15, 0], [5, 30]);
    const t = R.scoreTable(g);
    eq(t.rows[0].totals, { p1: 40, p2: -10 });
    eq(t.rows[1].totals, { p1: 30, p2: 20 });
    eq(t.rows[2], { scores: null, totals: null }, 'the open game has no score yet');
    R.setResult(g, 0, { closerId: 'p1', entries: { p2: { points: 0, notDown: false } } });
    eq(R.scoreTable(g).rows[1].totals, { p1: 30, p2: 40 });
    eq(g.rounds.length, 3, 'editing an old game does not open another one');
  });

  test('בדיקת תקינות של סוף משחק', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    eq(R.validateResult(g, { closerId: null, entries: {} }), 'בחר מי ניצח');
    eq(R.validateResult(g, { closerId: 'p1', entries: { p2: { points: 5 } } }), 'כמה נקודות נשארו ביד לג?');
    eq(R.validateResult(g, { closerId: 'p1', entries: { p2: { points: '' }, p3: { notDown: true } } }), 'כמה נקודות נשארו ביד לב?');
    eq(R.validateResult(g, { closerId: 'p1', entries: { p2: { points: -3 }, p3: { notDown: true } } }), 'כמה נקודות נשארו ביד לב?');
    eq(R.validateResult(g, { closerId: 'p1', entries: { p2: { points: '0' }, p3: { notDown: true } } }), null);
  });

  test('סיום ערב: המשחק הפתוח לא נספר, והמנצח הוא מי שצבר הכי הרבה', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    play(g, 1, [10, 0, 20], [5, 40, 30]);
    play(g, 0, [0, 5, 5], [25, 0, 10]);
    R.addPoints(g.rounds[2], 'p3', 500);
    R.finishGame(g);
    eq(g.rounds.length, 2);
    eq(totalsByName(g), { 'א': 20, 'ב': 35, 'ג': 15 });
    eq(R.playerById(g, g.winnerId).name, 'ב');
    ok(g.finishedAt, 'finishedAt set');
  });

  test('תיקו: המנצח שנבחר מקבל מקום ראשון', () => {
    const g = R.newGame(['א', 'ב', 'ג']);
    play(g, 0, [0, 10, 'X'], [20, 30, 0]);
    eq(R.leaders(g).map((p) => p.name), ['א', 'ב']);
    R.finishGame(g, 'p2');
    eq(R.ranking(g).map((r) => [r.player.name, r.place]), [['ב', 1], ['א', 2], ['ג', 3]]);
  });

  test('ערב שנשמר בלי משחק פתוח מקבל אחד, ומשחק בלי נקודות מקבל רשימה ריקה', () => {
    const g = { players: [{ id: 'p1', name: 'א' }, { id: 'p2', name: 'ב' }], firstDealer: 0,
      rounds: [{ result: { closerId: 'p1', entries: { p2: { points: 4, notDown: false } } } }] };
    R.normalize(g);
    eq(g.rounds.length, 2);
    eq(g.rounds[0].adds, {});
    eq(R.currentIndex(g), 1);
  });

  // ---------------- stats ----------------
  // Three evenings of A, B, C (two games each). Totals:
  //   g1: A 30, B 35, C -50 (B)   g2: A 70, B -65, C -20 (A)   g3: A -60, B 52, C 50 (B)
  function makeHistory() {
    const g1 = R.newGame(['A', 'B', 'C']);
    play(g1, 0, [0, 5, 'X'], [40, 10, 0]);
    play(g1, 1, [10, 0, 0], [0, 30, 20]);
    R.finishGame(g1); g1.finishedAt = '2025-12-20T20:00:00.000Z';
    const g2 = R.newGame(['A', 'B', 'C']);
    play(g2, 2, [5, 'X', 0], [25, 0, 10]);
    play(g2, 0, [0, 15, 30], [50, 20, 0]);
    R.finishGame(g2); g2.finishedAt = '2026-08-15T20:00:00.000Z';
    const g3 = R.newGame(['A', 'B', 'C']);
    play(g3, 0, [0, 0, 0], [10, 60, 5]);
    play(g3, 2, ['X', 8, 0], [0, 0, 45]);
    R.finishGame(g3); g3.finishedAt = '2026-10-31T20:00:00.000Z';
    return [g3, g1, g2]; // out of order on purpose
  }

  test('הניקוד הסופי של ערבי הדוגמה', () => {
    const [g3, g1, g2] = makeHistory();
    eq(totalsByName(g1), { A: 30, B: 35, C: -50 });
    eq(totalsByName(g2), { A: 70, B: -65, C: -20 });
    eq(totalsByName(g3), { A: -60, B: 52, C: 50 });
  });

  test('טבלת מנצחים, כלל הנקודות, ניצחונות במשחקים ו"לא ירד"', () => {
    const s = ST.summary(makeHistory());
    const by = {}; s.players.forEach((p) => { by[p.name] = p; });
    eq(s.players.map((p) => p.name), ['B', 'A', 'C']);
    eq([by.A.wins, by.B.wins, by.C.wins], [1, 2, 0]);
    eq([by.A.totalPoints, by.B.totalPoints, by.C.totalPoints], [40, 22, -20]);
    eq([by.A.best, by.A.worst], [70, -60]);
    eq([by.B.longestStreak, by.B.currentStreak, by.A.currentStreak], [1, 1, 0]);
    eq([by.A.closes, by.B.closes, by.C.closes], [3, 1, 2]);
    eq([by.A.notDowns, by.B.notDowns, by.C.notDowns], [1, 1, 1]);
    eq([by.A.roundsPlayed, by.A.scored, by.A.lost], [6, 125, 85]);
    eq(by.A.avgRound.toFixed(2), '6.67');
    eq([by.A.bestRound, by.B.bestRound, by.C.bestRound], [50, 60, 45]);
    eq([by.A.avgPlace.toFixed(2), by.B.avgPlace.toFixed(2)], ['2.00', '1.67']);
  });

  test('סטטיסטיקות כלליות', () => {
    const g = ST.summary(makeHistory()).general;
    eq([g.games, g.rounds, g.notDowns], [3, 6, 3]);
    eq([g.bestRound.name, g.bestRound.points, g.bestRound.round], ['B', 60, 1]);
    eq([g.bestGame.name, g.bestGame.points], ['A', 70]);
    eq(g.mostWins, { name: 'B', wins: 2 });
    eq(g.mostCloses, { name: 'A', closes: 3 });
    eq(g.longestStreak, { name: 'B', length: 1 });
  });

  test('מי ניצח בפעם הקודמת, וסינון לפי תקופה', () => {
    const h = makeHistory();
    eq(R.playerById(ST.lastGame(h), ST.lastGame(h).winnerId).name, 'B');
    const now = new Date('2026-11-01T10:00:00.000Z');
    eq(ST.filterByPeriod(h, 'all', now).length, 3);
    eq(ST.filterByPeriod(h, 'year', now).length, 2);
    eq(ST.filterByPeriod(h, '30d', now).length, 1);
  });

  test('ראש בראש: מי סיים עם יותר נקודות', () => {
    eq(ST.headToHead(makeHistory(), 'A', 'B'), { together: 3, a: 1, b: 2, even: 0 });
  });

  test('איחוד ייבוא לפי מזהה, בלי כפילויות', () => {
    const [g3, g1, g2] = makeHistory();
    const older = JSON.parse(JSON.stringify(g1));
    older.updatedAt = '2000-01-01T00:00:00.000Z';
    const m = ST.mergeHistory([g1], [older, g2]);
    eq(m.added, 1);
    eq(m.games.length, 2);
    eq(m.games[0].updatedAt, g1.updatedAt, 'the newer copy wins');
  });

  // ---------------- sync (against a fake GitHub) ----------------
  function fakeGitHub() {
    const files = {};
    let n = 0;
    const resp = (status, body) => ({ status, ok: status >= 200 && status < 300, json: async () => body, text: async () => JSON.stringify(body) });
    async function handler(url, init) {
      if (init.headers.Authorization !== 'Bearer good') return resp(401, {});
      const path = decodeURIComponent(new URL(url).pathname);
      if (path === '/repos/me/data') return resp(200, { full_name: 'me/data', private: true });
      const m = /^\/repos\/me\/data\/contents\/(.+)$/.exec(path);
      if (!m) return resp(404, {});
      const p = m[1];
      if (init.method === 'GET') {
        if (files[p]) return resp(200, { type: 'file', path: p, sha: files[p].sha, content: files[p].content });
        const prefix = p + '/';
        const list = Object.keys(files).filter((k) => k.startsWith(prefix) && !k.slice(prefix.length).includes('/'))
          .map((k) => ({ type: 'file', name: k.slice(prefix.length), path: k, sha: files[k].sha }));
        return list.length ? resp(200, list) : resp(404, {});
      }
      const body = JSON.parse(init.body);
      if (init.method === 'PUT') {
        if (files[p] ? body.sha !== files[p].sha : body.sha) return resp(409, {});
        files[p] = { content: body.content, sha: 's' + (++n) };
        return resp(200, { content: { sha: files[p].sha } });
      }
      if (init.method === 'DELETE') {
        if (!files[p] || body.sha !== files[p].sha) return resp(409, {});
        delete files[p];
        return resp(200, {});
      }
      return resp(405, {});
    }
    return { files, handler, read: (p) => JSON.parse(SY.b64decode(files[p].content)) };
  }
  const CFG = { owner: 'me', repo: 'data', token: 'good' };
  const newState = () => ({ current: null, history: [], lastPlayers: [], sync: SY.emptySync() });

  test('זיהוי שם המאגר', () => {
    eq(SY.parseRepo('me/data'), { owner: 'me', repo: 'data' });
    eq(SY.parseRepo('https://github.com/me/rummy51-data.git'), { owner: 'me', repo: 'rummy51-data' });
    eq(SY.parseRepo('just-a-name'), null);
  });

  test('קידוד עברית ל-base64 והחזרה', () => {
    const s = JSON.stringify({ name: 'שי ✕ 51' });
    eq(SY.b64decode(SY.b64encode(s)), s);
  });

  test('טוקן שגוי מחזיר הודעה ברורה', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    let msg = '';
    try { await SY.check({ owner: 'me', repo: 'data', token: 'bad' }); } catch (e) { msg = e.message; }
    eq(msg, 'הטוקן לא תקין או שפג תוקפו');
    eq((await SY.check(CFG)).private, true);
  });

  test('שמירה: ערב שהסתיים וערב פתוח נכתבים לגיט, ואחר כך מתעדכנים ונמחקים', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const st = newState();
    const [g3] = makeHistory();
    st.history.push(g3);
    st.sync.unsyncedGames.push(g3.id);
    st.current = R.newGame(['שי', 'דנה']);
    st.sync.currentVersion = 1;
    eq(SY.pending(st), 2);
    await SY.flush(st, CFG);
    eq(SY.pending(st), 0);
    eq(gh.read(SY.gamePath(g3)).id, g3.id);
    eq(gh.read('data/current.json').players[0].name, 'שי');

    play(st.current, 0, [0, 12]);
    st.sync.currentVersion++;
    await SY.flush(st, CFG);
    eq(R.playedCount(gh.read('data/current.json')), 1, 'current updated over existing sha');

    st.current = null;
    st.sync.currentVersion++;
    st.sync.deletedGames.push(SY.gamePath(g3));
    await SY.flush(st, CFG);
    eq(Object.keys(gh.files), []);
  });

  test('טלפון חדש מושך את כל הערבים והערב הפתוח מגיט', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const a = newState();
    a.history = makeHistory();
    a.sync.unsyncedGames = a.history.map((g) => g.id);
    a.current = R.newGame(['שי', 'דנה']);
    a.sync.currentVersion = 1;
    await SY.flush(a, CFG);

    const b = newState();
    const local = R.finishGame((() => { const g = R.newGame(['X', 'Y']); play(g, 0, [0, 5]); return g; })());
    b.history.push(local);
    const res = await SY.pull(b, CFG);
    eq(res.added, 3);
    eq(b.history.length, 4);
    eq(res.remoteCurrent.id, a.current.id);
    eq(b.sync.unsyncedGames, [local.id], 'a game only on this phone is queued for upload');
    ok(b.history.every((g, i, arr) => !i || arr[i - 1].finishedAt <= g.finishedAt), 'history sorted by date');
  });

  test('שינוי בערב בזמן שמירה לא הולך לאיבוד', async () => {
    const gh = fakeGitHub();
    const st = newState();
    st.current = R.newGame(['שי', 'דנה']);
    st.sync.currentVersion = 1;
    SY.fetchImpl = async (url, init) => {
      if (init.method === 'PUT') st.sync.currentVersion++; // a change lands while the request is in flight
      return gh.handler(url, init);
    };
    await SY.flush(st, CFG);
    eq(SY.pending(st), 1, 'the newer version is still pending');
  });

  // ---------------- tournaments ----------------
  const TT = RummyTournaments;
  // One game: the closer keeps 0, everyone else loses what is left in hand (10 by default).
  function finishedGame(names, tournamentId, finishedAt, closerIdx, hand) {
    const g = R.newGame(names);
    play(g, closerIdx || 0, hand || names.map((n, k) => (k === (closerIdx || 0) ? 0 : 10)));
    R.finishGame(g);
    g.finishedAt = finishedAt;
    if (tournamentId) g.tournamentId = tournamentId;
    return g;
  }

  test('הרכב: אותם שחקנים בכל סדר ישיבה הם אותו הרכב', () => {
    eq(TT.lineupKey(['ב', 'א', 'ג']), TT.lineupKey(['ג', ' א ', 'ב']));
    ok(TT.lineupKey(['א', 'ב']) !== TT.lineupKey(['א', 'ב', 'ג']), 'a different lineup');
    eq(TT.defaultName(['אבא', ' דני', 'רון']), 'אבא · דני · רון');
  });

  test('בחירת טורניר: הטורניר האחרון של ההרכב, ובלי ארכיון', () => {
    const t1 = TT.make('א · ב · ג', TT.lineupKey(['א', 'ב', 'ג']));
    const t2 = TT.make('אצל סבתא', null);
    const list = [t1, t2];
    const games = [
      finishedGame(['א', 'ב', 'ג'], t2.id, '2026-03-01T20:00:00.000Z'),
      finishedGame(['ג', 'א', 'ב'], t1.id, '2025-03-01T20:00:00.000Z')
    ];
    eq(TT.suggest(list, games, ['ב', 'ג', 'א']).id, t2.id, 'the lineup played last in t2');
    eq(TT.suggest(list, games, ['א', 'ב', 'ד']), null, 'a new lineup gets a new tournament');
    t2.archived = true;
    eq(TT.suggest(list, games, ['א', 'ב', 'ג']).id, t1.id, 'archived tournaments are not offered');
    const t3 = TT.make('א · ב', TT.lineupKey(['א', 'ב']));
    list.push(t3);
    eq(TT.suggest(list, games, ['ב', 'א']).id, t3.id, 'a tournament opened for the lineup, before its first game');
  });

  test('ערבים מלפני הטורנירים מתחלקים לטורנירים לפי ההרכב', () => {
    const games = [
      finishedGame(['A', 'B', 'C'], null, '2026-01-01T20:00:00.000Z'),
      finishedGame(['C', 'B', 'A'], null, '2026-01-02T20:00:00.000Z'),
      finishedGame(['A', 'B'], null, '2026-01-03T20:00:00.000Z')
    ];
    const list = [];
    const res = TT.ensure(list, games);
    eq(res.games.length, 3);
    eq(res.tournaments, true);
    eq(list.map((t) => t.name), ['A · B · C', 'A · B']);
    eq(games[0].tournamentId, games[1].tournamentId);
    ok(games[2].tournamentId !== games[0].tournamentId, 'a different lineup, a different tournament');
    eq(games[0].tournamentName, 'A · B · C');
    eq(TT.ensure(list, games), { games: [], tournaments: false }, 'nothing left to fix');
  });

  test('טורניר שמוכר רק מתוך ערב נבנה מחדש, וטורניר מחוק עם ערב חוזר', () => {
    const g = finishedGame(['A', 'B'], 'x1', '2026-01-01T20:00:00.000Z');
    g.tournamentName = 'אצל סבתא';
    const list = [];
    eq(TT.ensure(list, [g]).tournaments, true);
    eq([list[0].id, list[0].name], ['x1', 'אצל סבתא']);
    list[0].deleted = true;
    TT.ensure(list, [g]);
    eq(list[0].deleted, false);
  });

  test('איחוד רשימות טורנירים: העדכון האחרון גובר', () => {
    const a = { id: 'a', name: 'ישן', createdAt: '1', updatedAt: '2026-01-01' };
    const b = { id: 'b', name: 'רק כאן', createdAt: '2', updatedAt: '2026-01-01' };
    const a2 = { id: 'a', name: 'חדש', createdAt: '1', updatedAt: '2026-02-01' };
    const c = { id: 'c', name: 'רק שם', createdAt: '3', updatedAt: '2026-01-01' };
    const m = TT.merge([a, b], [a2, c]);
    eq(m.list.map((t) => t.name), ['חדש', 'רק כאן', 'רק שם']);
    eq([m.changed, m.ahead], [true, true]);
    const same = TT.merge([a2, c], [a2, c]);
    eq([same.changed, same.ahead], [false, false]);
  });

  test('מוביל הטורניר: הכי הרבה ניצחונות, ובשוויון יותר נקודות', () => {
    const t = TT.make('בית', null);
    const g1 = finishedGame(['A', 'B'], t.id, '2026-01-01T20:00:00.000Z', 0, [0, 50]); // A 0, B -50
    const g2 = finishedGame(['A', 'B'], t.id, '2026-01-02T20:00:00.000Z', 1, [10, 0]); // A -10, B 0
    const other = finishedGame(['A', 'B'], 'elsewhere', '2026-01-03T20:00:00.000Z', 1, [10, 0]);
    const games = [g1, g2, other];
    eq(ST.summary(ST.filterByTournament(games, t.id)).players.map((p) => [p.name, p.wins, p.totalPoints]), [['A', 1, -10], ['B', 1, -50]]);
    const row = TT.overview([t], games)[0];
    eq([row.games, row.leader.name, row.lastAt], [2, 'A', g2.finishedAt]);
    eq(ST.filterByTournament(games, 'all').length, 3);
  });

  test('הטורנירים נשמרים בגיט ונטענים בטלפון חדש', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const a = newState();
    a.tournaments = [TT.make('אצל סבתא', null)];
    a.sync.tournamentsVersion = 1;
    eq(SY.pending(a), 1);
    await SY.flush(a, CFG);
    eq(SY.pending(a), 0);
    eq(gh.read('data/tournaments.json').tournaments[0].name, 'אצל סבתא');

    const b = newState();
    await SY.pull(b, CFG);
    eq(b.tournaments.map((t) => t.name), ['אצל סבתא']);
    eq(SY.pending(b), 0, 'nothing new to upload');
    b.tournaments.push(TT.make('בבית', null));
    await SY.pull(b, CFG);
    eq(SY.pending(b), 1, 'a tournament that exists only here is queued');
    await SY.flush(b, CFG);
    eq(gh.read('data/tournaments.json').tournaments.map((t) => t.name), ['אצל סבתא', 'בבית']);
  });

  // ---------------- run ----------------
  const out = document.getElementById('out');
  let pass = 0;
  const failures = [];
  for (const [name, fn] of tests) {
    const li = document.createElement('li');
    try {
      await fn();
      pass++;
      li.className = 'pass';
      li.textContent = '✓ ' + name;
    } catch (e) {
      failures.push(name + ': ' + e.message);
      li.className = 'fail';
      li.textContent = '✗ ' + name;
      const small = document.createElement('small');
      small.textContent = e.message;
      li.appendChild(small);
    }
    out.appendChild(li);
  }
  SY.fetchImpl = null;
  const sum = document.getElementById('sum');
  sum.textContent = failures.length ? `${failures.length} נכשלו, ${pass} עברו` : `כל ${pass} הבדיקות עברו`;
  sum.className = failures.length ? 'fail' : 'pass';
  window.testResults = { pass, fail: failures.length, failures };
})();
</script>
