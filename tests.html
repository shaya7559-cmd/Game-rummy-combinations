<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקות רמי קומבינציות</title>
<style>
  body { font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif; margin: 16px; background: #fff; color: #1c1c1e; }
  .pass { color: #2f6b3f; }
  .fail { color: #b42318; font-weight: 700; }
  #sum { font-size: 1.2rem; font-weight: 700; }
  li small { display: block; direction: ltr; text-align: left; font-family: Consolas, monospace; }
</style>
</head>
<body>
<h1>בדיקות לוגיקה, סיכומים וסנכרון</h1>
<p id="sum">רץ…</p>
<ol id="out"></ol>
<script src="logic.js"></script>
<script src="stats.js"></script>
<script src="tournaments.js"></script>
<script src="sync.js"></script>
<script>
(async function () {
  'use strict';
  const R = Rummy, ST = RummyStats, TT = RummyTournaments, SY = RummySync;
  const tests = [];
  const test = (name, fn) => tests.push([name, fn]);
  function eq(actual, expected, msg) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error((msg ? msg + ': ' : '') + 'expected ' + e + ', got ' + a);
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  const later = (iso, ms) => new Date(Date.parse(iso) + ms).toISOString();

  // Plays the open game of a tournament.
  // adds[k] = points participant k got during the game (a number or a list; 0 = none).
  // hand[k] for everyone but the winner: points left in hand, or 'X' = never went down.
  function play(t, winnerIdx, hand, adds) {
    const g = R.currentGame(t);
    t.players.forEach((p, k) => {
      [].concat(adds && adds[k] != null ? adds[k] : []).forEach((n) => { if (n && !R.addPoints(g, p.id, n)) throw new Error('bad points ' + n); });
    });
    const res = { winnerId: t.players[winnerIdx].id, hands: {} };
    t.players.forEach((p, k) => {
      if (k === winnerIdx) return;
      res.hands[p.id] = hand[k] === 'X' ? { notDown: true } : { points: hand[k], notDown: false };
    });
    const err = R.validateResult(t, res);
    if (err) throw new Error(err);
    R.finishGame(t, g, res);
    return g;
  }
  const byName = (t, o) => { const out = {}; t.players.forEach((p) => { out[p.name] = o[p.id]; }); return out; };
  const pid = (t, name) => R.playerByName(t, name).id;

  // ---------------- logic ----------------
  test('טורניר חדש: משתתפים ומשחק פתוח אחד, בלי מספר משחקים קבוע', () => {
    const t = R.newTournament('בית', ['שי', 'דנה', 'רון']);
    eq(t.players.map((p) => p.name), ['שי', 'דנה', 'רון']);
    eq(t.games.length, 1);
    ok(R.currentGame(t) && !R.currentGame(t).result, 'an open game');
    play(t, 0, [0, 5, 5]);
    eq([t.games.length, R.finishedGames(t).length, R.gameNumber(t, R.currentGame(t))], [2, 1, 2], 'ending a game opens the next one');
  });

  test('נקודות במשחק: מוסיפים רק מספרים שלמים גדולים מאפס', () => {
    const g = R.newGame();
    eq([R.addPoints(g, 'a', 15), R.addPoints(g, 'a', '12')], [true, true]);
    eq([0, -5, 2.5, '', null, 'abc', R.MAX_POINTS + 1].map((n) => R.addPoints(g, 'a', n)), [false, false, false, false, false, false, false]);
    eq([R.entriesOf(g, 'a'), R.gamePoints(g, 'a')], [[15, 12], 27]);
  });

  test('הורדת נקודות: כל סכום, גם מתחת לאפס במשחק', () => {
    const g = R.newGame();
    R.addPoints(g, 'a', 30);
    eq(R.takePoints(g, 'a', 10), true);
    eq([R.entriesOf(g, 'a'), R.gamePoints(g, 'a')], [[30, -10], 20]);
    eq(R.takePoints(g, 'a', 50), true, 'more than the player has');
    eq(R.gamePoints(g, 'a'), -30);
    eq(R.takePoints(g, 'b', 15), true, 'a player with no points (a penalty)');
    eq(R.gamePoints(g, 'b'), -15);
    eq([0, -5, 2.5, '', R.MAX_POINTS + 1].map((n) => R.takePoints(g, 'a', n)), [false, false, false, false, false]);
  });

  test('תיקון ומחיקה של רישום: הסימן נשמר, ומותר לרדת מתחת לאפס', () => {
    const g = R.newGame();
    R.addPoints(g, 'a', 30);
    R.takePoints(g, 'a', 20);
    R.addPoints(g, 'b', 15);
    eq(R.setEntry(g, 'a', 1, 5), true);
    eq(R.entriesOf(g, 'a'), [30, -5], 'a fix keeps the sign');
    eq(R.setEntry(g, 'a', 0, 0), false, 'a fix must be above 0');
    eq(R.setEntry(g, 'a', 2, 5), false, 'no such entry');
    eq(R.removeEntry(g, 'a', 0), true);
    eq([R.entriesOf(g, 'a'), R.gamePoints(g, 'a')], [[-5], -5]);
    eq(R.entriesOf(g, 'b'), [15], 'other entries untouched');
    eq(g.points.map((e) => e.pid), ['a', 'b'], 'order of entry kept');
  });

  test('המנצח הוא האחרון שקיבל נקודות, וטעות שהורדה לא נחשבת', () => {
    const g = R.newGame();
    eq(R.lastScorer(g), null, 'nobody scored');
    R.addPoints(g, 'a', 20);
    R.addPoints(g, 'b', 15);
    R.addPoints(g, 'a', 10);
    eq(R.lastScorer(g), 'a');
    R.addPoints(g, 'c', 40);
    R.takePoints(g, 'c', 40); // entered for the wrong player
    eq(R.lastScorer(g), 'a', 'c has nothing left in this game');
    R.addPoints(g, 'b', 5);
    eq(R.lastScorer(g), 'b');
  });

  test('המנצח: נקודות שהורדו מבטלות את הרישום האחרון של אותו משתתף, וקנס לא משנה את המנצח', () => {
    const g = R.newGame();
    R.addPoints(g, 'a', 10);
    R.addPoints(g, 'b', 20);
    R.addPoints(g, 'a', 30); // a mistake: a still has 10 from before
    R.takePoints(g, 'a', 30);
    eq(R.lastScorer(g), 'b', 'the cancelled +30 does not make a the winner');
    const h = R.newGame();
    R.addPoints(h, 'a', 30);
    R.takePoints(h, 'b', 50); // a penalty for b
    eq(R.lastScorer(h), 'a');
    R.takePoints(h, 'a', 10); // part of a's points: a still went out last
    eq(R.lastScorer(h), 'a');
  });

  test('סוף משחק: המנצח שומר את מה שצבר, השאר מפסידים את מה שנשאר ביד או 70', () => {
    const t = R.newTournament('בית', ['א', 'ב', 'ג']);
    const g = play(t, 0, [0, 12, 'X'], [[30, 20], 15, 0]);
    eq(byName(t, R.gameScores(t, g)), { 'א': 50, 'ב': 3, 'ג': -70 });
    eq(g.result.hands[t.players[2].id], { points: 0, notDown: true });
    ok(g.finishedAt, 'finished time recorded');
  });

  test('בדיקת סוף משחק: חייב מנצח וכמה נשאר ביד לכל השאר', () => {
    const t = R.newTournament('בית', ['שי', 'דנה', 'רון']);
    const [a, b, c] = t.players.map((p) => p.id);
    eq(R.validateResult(t, { winnerId: null, hands: {} }), 'בחר מי ניצח');
    eq(R.validateResult(t, { winnerId: a, hands: { [b]: { points: 5 } } }), 'כמה נקודות נשארו ביד לרון?');
    eq(R.validateResult(t, { winnerId: a, hands: { [b]: { points: '' }, [c]: { points: 1 } } }), 'כמה נקודות נשארו ביד לדנה?');
    eq(R.validateResult(t, { winnerId: a, hands: { [b]: { points: 0 }, [c]: { notDown: true } } }), null);
  });

  test('לא ירד מוצע למי שאין לו נקודות במשחק', () => {
    const g = R.newGame();
    R.addPoints(g, 'a', 10);
    R.addPoints(g, 'b', 10);
    R.takePoints(g, 'b', 10);
    eq([R.suggestNotDown(g, 'a'), R.suggestNotDown(g, 'b'), R.suggestNotDown(g, 'c')], [false, true, true]);
  });

  test('הדירוג כולל את המשחק שבאמצע ומתעדכן עם כל נקודה', () => {
    const t = R.newTournament('בית', ['שי', 'דנה', 'רון']);
    play(t, 0, [0, 10, 10], [40, 20, 30]); // שי 40, דנה 10, רון 20
    eq(R.standings(t, true).map((r) => r.player.name), ['שי', 'רון', 'דנה']);
    const g = R.currentGame(t);
    R.addPoints(g, pid(t, 'דנה'), 35);
    eq(R.standings(t, true).map((r) => [r.player.name, r.total]), [['דנה', 45], ['שי', 40], ['רון', 20]], 'live');
    eq(R.standings(t, false).map((r) => r.player.name), ['שי', 'רון', 'דנה'], 'without the open game');
    R.takePoints(g, pid(t, 'דנה'), 15);
    eq(R.standings(t, true).map((r) => [r.player.name, r.place]), [['שי', 1], ['דנה', 2], ['רון', 3]]);
  });

  test('מחלק: הראשון שנבחר, ובכל משחק הבא המשתתף הבא לפי הסדר', () => {
    const t = R.newTournament('בית', ['שי', 'דנה', 'רון'], 1);
    const dealer = () => R.playerById(t, R.dealerOf(t, R.currentGame(t))).name;
    eq(dealer(), 'דנה', 'chosen when the tournament starts');
    play(t, 0, [0, 5, 5]);
    eq(dealer(), 'רון');
    play(t, 0, [0, 5, 5]);
    eq(dealer(), 'שי', 'back to the first seat');
    const x = R.newTournament('x', ['א', 'ב']);
    eq(x.games[0].dealerId, x.players[0].id, 'the first participant by default');
  });

  test('שינוי מחלק במשחק הנוכחי, והמשחקים הבאים ממשיכים ממנו; משתתף חדש נכנס לסבב', () => {
    const t = R.newTournament('בית', ['א', 'ב', 'ג']);
    const g = R.currentGame(t);
    eq(R.setDealer(t, g, 'nobody'), false);
    eq(R.setDealer(t, g, t.players[2].id), true);
    eq(R.dealerOf(t, g), t.players[2].id);
    play(t, 0, [0, 5, 5]);
    eq(R.dealerOf(t, R.currentGame(t)), t.players[0].id, 'after ג comes א');
    R.addPlayer(t, 'ד');
    play(t, 0, [0, 5, 5, 5]);
    play(t, 0, [0, 5, 5, 5]);
    play(t, 0, [0, 5, 5, 5]);
    eq(R.playerById(t, R.dealerOf(t, R.currentGame(t))).name, 'ד', 'the new participant deals after ג');
    // games saved without a dealer count on from the last one that has one
    const u = R.newTournament('ישן', ['א', 'ב', 'ג']);
    play(u, 0, [0, 5, 5]);
    u.games.forEach((x) => delete x.dealerId);
    eq(R.dealerOf(u, R.currentGame(u)), u.players[1].id, 'by game number');
    u.games[0].dealerId = u.players[2].id;
    eq(R.dealerOf(u, R.currentGame(u)), u.players[0].id, 'from the last game that has a dealer');
  });

  test('שוויון בניקוד: אותו מקום, וקודם מי שניצח יותר', () => {
    const t = R.newTournament('בית', ['א', 'ב', 'ג']);
    play(t, 1, [10, 0, 10], [10, 0, 10]);  // א 0, ב 0 (won), ג 0
    const rows = R.standings(t, true);
    eq(rows.map((r) => [r.player.name, r.place, r.wins]), [['ב', 1, 1], ['א', 1, 0], ['ג', 1, 0]]);
  });

  test('ניצחונות נספרים לכל משתתף', () => {
    const t = R.newTournament('בית', ['א', 'ב']);
    play(t, 0, [0, 5]);
    play(t, 1, [5, 0]);
    play(t, 0, [0, 5]);
    eq(byName(t, R.wins(t)), { 'א': 2, 'ב': 1 });
    eq(R.gameTable(t).map((r) => r.number), [1, 2, 3]);
    eq(byName(t, R.gameTable(t)[2].totals), { 'א': -5, 'ב': -10 });
  });

  test('משתתף שמצטרף באמצע מתחיל מאפס ולא נחשב במשחקים שלפניו', () => {
    const t = R.newTournament('בית', ['א', 'ב']);
    play(t, 0, [0, 5], [20, 0]);
    const p = R.addPlayer(t, 'ג');
    eq(R.inGame(t.games[0], p.id), false);
    eq(R.validateResult(t, { winnerId: t.players[0].id, hands: { [t.players[1].id]: { points: 1 } } }), 'כמה נקודות נשארו ביד לג?', 'plays from the open game');
    play(t, 2, [5, 5, 0], [0, 0, 30]);
    eq(byName(t, R.totals(t, false)), { 'א': 15, 'ב': -10, 'ג': 30 });
    eq(R.inGame(t.games[1], p.id), true);
  });

  test('סיום טורניר: הכי הרבה נקודות, בשוויון יותר ניצחונות, ובשוויון בשניהם משותף', () => {
    const t = R.newTournament('בית', ['א', 'ב', 'ג']);
    play(t, 0, [0, 30, 20], [20, 0, 0]);
    play(t, 1, [10, 0, 0], [0, 30, 0]);
    R.addPoints(R.currentGame(t), t.players[2].id, 99);
    R.finishTournament(t);
    eq(R.currentGame(t), null, 'the open game is dropped');
    eq(t.winnerIds.map((id) => R.playerById(t, id).name), ['א'], 'א 10 points, ב 0, ג -20');
    const u = R.newTournament('שוויון', ['א', 'ב']);
    play(u, 0, [0, 0]);
    play(u, 1, [0, 0]);
    R.finishTournament(u);
    eq(u.winnerIds.length, 2, 'shared');
    R.reopenTournament(u);
    ok(!u.finishedAt && !u.winnerIds && R.currentGame(u), 'reopened with a new open game');
  });

  test('תיקון משחק שהסתיים משנה את הניקוד ולא פותח משחק נוסף', () => {
    const t = R.newTournament('בית', ['א', 'ב']);
    const g = play(t, 0, [0, 10], [20, 0]);
    const done = g.finishedAt;
    R.finishGame(t, g, { winnerId: t.players[1].id, hands: { [t.players[0].id]: { points: 5 } } });
    eq(byName(t, R.totals(t, false)), { 'א': 15, 'ב': 0 });
    eq([t.games.length, g.finishedAt], [2, done]);
  });

  test('תיקון מבנה: שני משחקים פתוחים מאוחדים לאחד, עם הנקודות', () => {
    const t = R.newTournament('בית', ['א', 'ב']);
    const empty = R.newGame(later(t.createdAt, 5));
    t.games.push(empty);
    R.addPoints(t.games[0], t.players[0].id, 10);
    R.normalize(t);
    eq(t.games.length, 1);
    eq(R.gamePoints(R.currentGame(t), t.players[0].id), 10);
  });

  // ---------------- summaries ----------------
  test('סיכום טורניר: נקודות, ניצחונות, משחקים, לא ירד והמשחק הטוב', () => {
    const t = R.newTournament('בית', ['א', 'ב']);
    play(t, 0, [0, 'X'], [50, 0]);  // א 50, ב -70
    play(t, 1, [10, 0], [0, 20]);   // א -10, ב 20
    R.addPoints(R.currentGame(t), t.players[1].id, 500); // not finished: not counted
    const s = ST.tournamentSummary(t);
    eq(s.games, 2);
    eq(s.players.map((p) => [p.name, p.place, p.points, p.wins, p.games, p.notDowns, p.best, p.avg]),
      [['א', 1, 40, 1, 2, 0, 50, 20], ['ב', 2, -50, 1, 2, 1, 20, -25]]);
    eq(s.winners, null, 'still running');
  });

  test('סיכום כללי: כלל הנקודות של כל משתתף מכל הטורנירים', () => {
    const a = R.newTournament('בית', ['שי', 'דנה']);
    play(a, 0, [0, 10], [30, 5]);    // שי 30, דנה -5
    play(a, 0, [0, 10], [20, 0]);    // שי 20, דנה -10 → שי 50, דנה -15
    R.finishTournament(a);
    const b = R.newTournament('אצל סבתא', ['דנה', 'רון', 'שי']);
    play(b, 0, [0, 5, 5], [60, 0, 0]); // דנה 60, רון -5, שי -5
    const deleted = TT.tombstone(R.newTournament('מחוק', ['שי']));
    const all = ST.overall([a, b, deleted]);
    eq(all.players.map((s) => [s.name, s.points, s.wins, s.games, s.tournaments, s.tournamentWins]),
      [['שי', 45, 2, 3, 2, 1], ['דנה', 45, 1, 3, 2, 0], ['רון', -5, 0, 1, 1, 0]], 'equal points: more wins first');
    eq([all.general.tournaments, all.general.finished, all.general.games], [2, 1, 3]);
    eq([all.general.bestGame.name, all.general.bestGame.points, all.general.bestGame.tournament], ['דנה', 60, 'אצל סבתא']);
    eq([all.general.mostWins.name, all.general.mostWins.wins], ['שי', 2]);
    eq(ST.byTournament([a, b]).map((s) => s.tournament.name), ['אצל סבתא', 'בית'], 'running first');
  });

  test('שמות מוכרים לפי כמה פעמים שיחקו', () => {
    const a = R.newTournament('1', ['שי', 'דנה']);
    const b = R.newTournament('2', ['דנה', 'רון']);
    eq(ST.playerNames([a, b])[0], 'דנה');
  });

  // ---------------- merging copies ----------------
  test('איחוד שני עותקים של טורניר: משחקים מכאן ומשם, והעדכון האחרון של כל משחק גובר', () => {
    const base = R.newTournament('בית', ['א', 'ב']);
    play(base, 0, [0, 5], [10, 0]);
    const a = JSON.parse(JSON.stringify(base));
    const b = JSON.parse(JSON.stringify(base));
    // phone a finishes game 2; phone b renames the tournament later
    play(a, 1, [5, 0], [0, 20]);
    b.name = 'בבית';
    b.metaAt = later(a.games[1].updatedAt, 1000);
    const m = TT.mergeTournament(a, b);
    eq(m.tournament.name, 'בבית');
    eq(R.finishedGames(m.tournament).length, 2);
    eq(R.finishedGames(m.tournament)[1].result.winnerId, base.players[1].id);
    eq(m.tournament.games.filter((g) => !g.result).length, 1, 'one open game');
    eq([m.changed, m.ahead], [true, true]);
    const same = TT.mergeTournament(m.tournament, JSON.parse(JSON.stringify(m.tournament)));
    eq([same.changed, same.ahead], [false, false]);
  });

  test('איחוד: שינוי מחלק בטלפון אחד מגיע לשני', () => {
    const a = R.newTournament('בית', ['א', 'ב', 'ג']);
    const b = JSON.parse(JSON.stringify(a));
    const g = R.currentGame(b);
    R.setDealer(b, g, b.players[2].id);
    g.updatedAt = later(g.updatedAt, 1000);
    const m = TT.mergeTournament(a, b);
    eq(m.changed, true, 'the change is noticed');
    eq(R.dealerOf(m.tournament, R.currentGame(m.tournament)), a.players[2].id);
  });

  test('טורניר שנמחק נשאר מחוק גם אחרי איחוד עם עותק ישן', () => {
    const t = R.newTournament('בית', ['א', 'ב']);
    const old = JSON.parse(JSON.stringify(t));
    const dead = TT.tombstone(t);
    dead.metaAt = later(t.metaAt, 1000);
    eq(TT.mergeTournament(old, dead).tournament.deleted, true);
    eq(TT.mergeTournament(dead, old).tournament.deleted, true);
    eq(TT.live([dead, R.newTournament('x', ['a', 'b'])]).length, 1);
  });

  test('ייבוא רשימה: טורניר חדש נוסף, קיים מתעדכן, זהה לא משתנה', () => {
    const a = R.newTournament('א', ['1', '2']);
    const b = R.newTournament('ב', ['1', '2']);
    const b2 = JSON.parse(JSON.stringify(b));
    play(b2, 0, [0, 5]);
    const c = R.newTournament('ג', ['1', '2']);
    const m = TT.mergeLists([a, b], [JSON.parse(JSON.stringify(a)), b2, c]);
    eq([m.list.length, m.added, m.changed], [3, 1, [b.id, c.id]]);
    eq(R.finishedGames(m.list[1]).length, 1);
  });

  // ---------------- data from the first version ----------------
  const V1 = {
    lastPlayers: ['דנה', 'שי'],
    tournaments: [
      { id: 'tA', name: 'אצל סבתא', lineup: null, createdAt: '2026-11-01T18:00:00.000Z', updatedAt: '2026-11-01T18:00:00.000Z', archived: false },
      { id: 'tB', name: 'ישן', lineup: null, createdAt: '2026-10-01T18:00:00.000Z', updatedAt: '2026-10-01T18:00:00.000Z', archived: true },
      { id: 'tC', name: 'ריק', lineup: null, createdAt: '2026-10-02T18:00:00.000Z', updatedAt: '2026-10-02T18:00:00.000Z', archived: false }
    ],
    history: [
      {
        id: 'e1', tournamentId: 'tA', tournamentName: 'אצל סבתא', firstDealer: 0, winnerId: 'p2',
        createdAt: '2026-11-01T18:00:00.000Z', updatedAt: '2026-11-01T22:00:00.000Z', finishedAt: '2026-11-01T22:00:00.000Z',
        players: [{ id: 'p1', name: 'שי' }, { id: 'p2', name: 'דנה' }],
        rounds: [
          { adds: { p1: [30, 20], p2: [15] }, result: { closerId: 'p1', entries: { p2: { points: 12, notDown: false } } } },
          { adds: { p2: [40] }, result: { closerId: 'p2', entries: { p1: { points: 0, notDown: true } } } }
        ]
      },
      {
        id: 'e3', tournamentId: 'tB', firstDealer: 0, winnerId: 'p1',
        createdAt: '2026-10-01T18:00:00.000Z', updatedAt: '2026-10-01T22:00:00.000Z', finishedAt: '2026-10-01T22:00:00.000Z',
        players: [{ id: 'p1', name: 'רון' }, { id: 'p2', name: 'שי' }],
        rounds: [{ adds: { p1: [20] }, result: { closerId: 'p1', entries: { p2: { points: 30, notDown: false } } } }]
      }
    ],
    current: {
      id: 'e2', tournamentId: 'tA', firstDealer: 1, createdAt: '2026-11-03T18:00:00.000Z', updatedAt: '2026-11-03T19:00:00.000Z',
      players: [{ id: 'p1', name: 'דנה' }, { id: 'p2', name: 'שי' }],
      rounds: [
        { adds: { p1: [10] }, result: { closerId: 'p1', entries: { p2: { points: 5, notDown: false } } } },
        { adds: { p2: [25] }, result: null }
      ]
    }
  };

  test('המרת נתונים מהגרסה הראשונה: כל משחק של ערב הופך למשחק בטורניר שלו', () => {
    const list = TT.fromV1(JSON.parse(JSON.stringify(V1)));
    eq(list.map((t) => t.id).sort(), ['tA', 'tB', 'tC']);
    const a = TT.find(list, 'tA');
    eq(a.name, 'אצל סבתא');
    eq(a.players.map((p) => p.name), ['שי', 'דנה'], 'participants matched by name across evenings');
    eq(R.finishedGames(a).map((g) => g.id), ['e1-1', 'e1-2', 'e2-1']);
    eq(byName(a, R.totals(a, false)), { 'שי': -25, 'דנה': 53 });
    eq(byName(a, R.wins(a)), { 'שי': 1, 'דנה': 2 });
    eq(byName(a, R.totals(a, true)), { 'שי': 0, 'דנה': 53 }, 'the open game keeps its points');
    eq(R.currentGame(a).id, 'e2-2');
    const dealers = a.games.map((g) => R.playerById(a, g.dealerId).name);
    eq(dealers, ['שי', 'דנה', 'שי', 'דנה'], 'the dealer of every game, moving one seat each round');
    const b = TT.find(list, 'tB');
    ok(b.finishedAt, 'an archived tournament becomes finished');
    eq(b.winnerIds.map((id) => R.playerById(b, id).name), ['רון']);
    const c = TT.find(list, 'tC');
    eq([c.name, R.finishedGames(c).length, !!R.currentGame(c)], ['ריק', 0, true]);
  });

  test('המרה פעמיים נותנת אותם מזהים (שני טלפונים לא יוצרים כפילויות)', () => {
    const ids = (list) => list.map((t) => [t.id, t.players.map((p) => p.id), t.games.filter((g) => g.result).map((g) => g.id)]);
    const x = TT.fromV1(JSON.parse(JSON.stringify(V1)));
    const y = TT.fromV1(JSON.parse(JSON.stringify(V1)));
    eq(ids(x), ids(y));
    const m = TT.mergeTournament(TT.find(x, 'tA'), TT.find(y, 'tA'));
    eq(m.tournament.players.length, 2, 'no duplicated participants');
    eq(R.finishedGames(m.tournament).length, 3, 'no duplicated games');
  });

  // ---------------- sync (against a fake GitHub) ----------------
  function fakeGitHub() {
    const files = {};
    let n = 0;
    const log = [];
    const resp = (status, body) => ({ status, ok: status >= 200 && status < 300, json: async () => body, text: async () => JSON.stringify(body) });
    async function handler(url, init) {
      if (init.headers.Authorization !== 'Bearer good') return resp(401, {});
      const path = decodeURIComponent(new URL(url).pathname);
      log.push(init.method + ' ' + path.replace('/repos/me/data/contents/', ''));
      if (path === '/repos/me/data') return resp(200, { full_name: 'me/data', private: true });
      const m = /^\/repos\/me\/data\/contents\/(.+)$/.exec(path);
      if (!m) return resp(404, {});
      const p = m[1];
      if (init.method === 'GET') {
        if (files[p]) return resp(200, { type: 'file', path: p, sha: files[p].sha, content: files[p].content });
        const prefix = p + '/';
        const list = Object.keys(files).filter((k) => k.startsWith(prefix) && !k.slice(prefix.length).includes('/'))
          .map((k) => ({ type: 'file', name: k.slice(prefix.length), path: k, sha: files[k].sha }));
        return list.length ? resp(200, list) : resp(404, {});
      }
      const body = JSON.parse(init.body);
      if (init.method === 'PUT') {
        if (files[p] ? body.sha !== files[p].sha : body.sha) return resp(files[p] && !body.sha ? 422 : 409, {});
        files[p] = { content: body.content, sha: 's' + (++n) };
        return resp(200, { content: { sha: files[p].sha } });
      }
      if (init.method === 'DELETE') {
        if (!files[p] || body.sha !== files[p].sha) return resp(409, {});
        delete files[p];
        return resp(200, {});
      }
      return resp(405, {});
    }
    return { files, log, handler, read: (p) => JSON.parse(SY.b64decode(files[p].content)) };
  }
  const CFG = { owner: 'me', repo: 'data', token: 'good' };
  const newState = () => ({ tournaments: [], sync: SY.emptySync() });
  const path = (t) => SY.tournamentPath(t.id);

  test('זיהוי שם המאגר', () => {
    eq(SY.parseRepo('me/data'), { owner: 'me', repo: 'data' });
    eq(SY.parseRepo('https://github.com/me/RummyCombos-data.git'), { owner: 'me', repo: 'RummyCombos-data' });
    eq(SY.parseRepo('just-a-name'), null);
  });

  test('קידוד עברית ל-base64 והחזרה', () => {
    const s = JSON.stringify({ name: 'שי ✕ 70' });
    eq(SY.b64decode(SY.b64encode(s)), s);
  });

  test('טוקן שגוי מחזיר הודעה ברורה', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    let msg = '';
    try { await SY.check({ owner: 'me', repo: 'data', token: 'bad' }); } catch (e) { msg = e.message; }
    eq(msg, 'הטוקן לא תקין או שפג תוקפו');
    eq((await SY.check(CFG)).private, true);
  });

  test('שמירה: כל טורניר הוא קובץ, כולל המשחק שבאמצע, ומתעדכן אחרי כל שינוי', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const st = newState();
    const t = R.newTournament('בית', ['שי', 'דנה']);
    st.tournaments.push(t);
    SY.markDirty(st, t.id);
    eq(SY.pending(st), 1);
    await SY.flush(st, CFG);
    eq(SY.pending(st), 0);
    eq(gh.read(path(t)).players.map((p) => p.name), ['שי', 'דנה']);
    R.addPoints(R.currentGame(t), t.players[0].id, 25);
    SY.markDirty(st, t.id);
    await SY.flush(st, CFG);
    eq(R.gamePoints(gh.read(path(t)).games[0], t.players[0].id), 25, 'the game in progress is saved');
    st.tournaments[0] = TT.tombstone(t);
    SY.markDirty(st, t.id);
    await SY.flush(st, CFG);
    eq(gh.read(path(t)).deleted, true, 'a deleted tournament is kept as a tombstone');
  });

  test('טלפון חדש מושך את כל הטורנירים, ובפעם הבאה מוריד רק מה שהשתנה', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const a = newState();
    const t1 = R.newTournament('בית', ['שי', 'דנה']);
    const t2 = R.newTournament('אצל סבתא', ['שי', 'רון']);
    play(t1, 0, [0, 5], [10, 0]);
    a.tournaments.push(t1, t2);
    SY.markDirty(a, t1.id);
    SY.markDirty(a, t2.id);
    await SY.flush(a, CFG);

    const b = newState();
    const local = R.newTournament('רק כאן', ['X', 'Y']);
    b.tournaments.push(local);
    const res = await SY.pull(b, CFG);
    eq(res, { added: 2, updated: 0 });
    eq(b.tournaments.length, 3);
    eq(Object.keys(b.sync.dirty), [local.id], 'a tournament only on this phone is queued for upload');
    eq(R.finishedGames(TT.find(b.tournaments, t1.id)).length, 1);

    R.addPoints(R.currentGame(t1), t1.players[1].id, 40);
    R.touch(t1, R.currentGame(t1));
    SY.markDirty(a, t1.id);
    await SY.flush(a, CFG);
    gh.log.length = 0;
    const res2 = await SY.pull(b, CFG);
    eq(res2, { added: 0, updated: 1 });
    eq(gh.log.filter((l) => l.startsWith('GET data/tournaments/')).length, 1, 'only the changed file is downloaded');
    eq(R.gamePoints(R.currentGame(TT.find(b.tournaments, t1.id)), t1.players[1].id), 40, 'continue the game from the other phone');
  });

  test('שני טלפונים שמרו את אותו טורניר: השינויים של שניהם נשמרים', async () => {
    const gh = fakeGitHub();
    SY.fetchImpl = gh.handler;
    const a = newState();
    const t = R.newTournament('בית', ['שי', 'דנה']);
    a.tournaments.push(t);
    SY.markDirty(a, t.id);
    await SY.flush(a, CFG);
    const b = newState();
    await SY.pull(b, CFG);

    // a renames the tournament, b scores in the open game; b's copy of the file is out of date
    t.name = 'בבית';
    R.touchMeta(t);
    t.metaAt = later(t.createdAt, 1000); // a clearly later stamp: the test runs within one millisecond
    SY.markDirty(a, t.id);
    await SY.flush(a, CFG);
    const tb = TT.find(b.tournaments, t.id);
    const g = R.currentGame(tb);
    R.addPoints(g, tb.players[0].id, 30);
    R.touch(tb, g);
    SY.markDirty(b, t.id);
    await SY.flush(b, CFG);
    const saved = gh.read(path(t));
    eq(saved.name, 'בבית', "a's change kept");
    eq(R.gamePoints(R.currentGame(saved), t.players[0].id), 30, "b's change kept");
    eq(TT.find(b.tournaments, t.id).name, 'בבית', 'b sees the new name too');
    eq(SY.pending(b), 0);
  });

  test('שינוי בזמן שמירה לא הולך לאיבוד', async () => {
    const gh = fakeGitHub();
    const st = newState();
    const t = R.newTournament('בית', ['שי', 'דנה']);
    st.tournaments.push(t);
    SY.markDirty(st, t.id);
    SY.fetchImpl = async (url, init) => {
      if (init.method === 'PUT') SY.markDirty(st, t.id); // a change lands while the request is in flight
      return gh.handler(url, init);
    };
    await SY.flush(st, CFG);
    eq(SY.pending(st), 1, 'the newer version is still pending');
  });

  // ---------------- run ----------------
  const out = document.getElementById('out');
  let pass = 0;
  const failures = [];
  for (const [name, fn] of tests) {
    const li = document.createElement('li');
    try {
      await fn();
      pass++;
      li.className = 'pass';
      li.textContent = '✓ ' + name;
    } catch (e) {
      failures.push(name + ': ' + e.message);
      li.className = 'fail';
      li.textContent = '✗ ' + name;
      const small = document.createElement('small');
      small.textContent = e.message;
      li.appendChild(small);
    }
    out.appendChild(li);
  }
  SY.fetchImpl = null;
  const sum = document.getElementById('sum');
  sum.textContent = failures.length ? `${failures.length} נכשלו, ${pass} עברו` : `כל ${pass} הבדיקות עברו`;
  sum.className = failures.length ? 'fail' : 'pass';
  window.testResults = { pass, fail: failures.length, failures };
})();
</script>
